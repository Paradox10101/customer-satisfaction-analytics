version: '3.8'

# Customer Satisfaction Analytics - Docker Compose
# Servicios externos para desarrollo local (COSTO: $0.00)

services:
  # Streamlit Dashboard (Reemplazo de QuickSight $9/mes)
  streamlit-dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: customer-analytics-dashboard
    ports:
      - "8501:8501"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - S3_DATA_BUCKET=${S3_DATA_BUCKET}
      - S3_RESULTS_BUCKET=${S3_RESULTS_BUCKET}
      - ATHENA_WORKGROUP=${ATHENA_WORKGROUP}
      - ATHENA_DATABASE=${ATHENA_DATABASE:-customer_satisfaction_db}
      - STREAMLIT_SERVER_PORT=8501
    volumes:
      - ../analytics/streamlit_dashboard:/app/streamlit_dashboard
      - ../data:/app/data
      - aws-credentials:/home/analytics/.aws
    command: ["streamlit"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - analytics-network

  # Cost Monitor (Protección Free Tier)
  cost-monitor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: customer-analytics-monitor
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    volumes:
      - ../scripts:/app/scripts
      - ../logs:/app/logs
      - aws-credentials:/home/analytics/.aws
    command: ["cost-monitor"]
    restart: unless-stopped
    networks:
      - analytics-network

  # Data Processor Local (Reemplazo de AWS Glue Jobs extensivos)
  data-processor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: customer-analytics-processor
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - S3_DATA_BUCKET=${S3_DATA_BUCKET}
      - S3_RESULTS_BUCKET=${S3_RESULTS_BUCKET}
      - PROCESSING_MODE=local
    volumes:
      - ../processing:/app/processing
      - ../ingestion:/app/ingestion
      - ../data:/app/data
      - aws-credentials:/home/analytics/.aws
    command: ["data-processor"]
    restart: "no"
    networks:
      - analytics-network

  # Nginx Reverse Proxy (para producción local)
  nginx:
    image: nginx:alpine
    container_name: customer-analytics-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - streamlit-dashboard
    restart: unless-stopped
    networks:
      - analytics-network

  # Redis para caché (opcional, gratis)
  redis:
    image: redis:7-alpine
    container_name: customer-analytics-cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - analytics-network

  # Grafana OSS (Alternativa gratuita a Grafana Cloud)
  grafana:
    image: grafana/grafana-oss:latest
    container_name: customer-analytics-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_INSTALL_PLUGINS=grafana-athena-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    restart: unless-stopped
    networks:
      - analytics-network

volumes:
  aws-credentials:
    driver: local
  redis-data:
    driver: local
  grafana-data:
    driver: local

networks:
  analytics-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
